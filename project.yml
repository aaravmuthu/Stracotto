name: Stracotto
options:
  bundleIdPrefix: com.aaravmuthu
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
settings:
  base:
    DEVELOPMENT_TEAM: 39QKJR8ATM
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
targets:
  Stracotto:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - App
      - Shared
      - path: Resources/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Stracotto
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        # Self-updates (Sparkle). Updates are only accepted when signed by the private key matching SUPublicEDKey.
        SUFeedURL: $(STRACOTTO_FEED_URL)
        SUPublicEDKey: gnZQ6sWbm4p3GgXOPaPRpn81J84N1KFMuXxZNRvanj8=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        NSHumanReadableCopyright: "© 2026 Aarav Muthu"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaravmuthu.stracotto
        # Where the app looks for updates. The single place to change once the public host is decided.
        STRACOTTO_FEED_URL: https://github.com/mks909/Stracotto-releases/releases/latest/download/appcast.xml
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
